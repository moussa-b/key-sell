name: Web - Version bump

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'

# The API and web workflows both push version bumps to main
concurrency:
  group: version-bump-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get and update version in environment.ts and package.json
        id: version
        run: |
          # Extract version from environment.ts
          VERSION=$(grep "version:" apps/web/src/environments/environment.ts | awk -F"'" '{print $2}')
          DATE_PART=$(echo $VERSION | cut -d'.' -f1-3)  # Extract yyyy.mm.dd
          LAST_PUSH=$(echo $VERSION | cut -d'.' -f4)    # Extract last 2 digits

          # Get current date in yyyy.mm.dd format
          TODAY=$(date +'%Y.%m.%d')

          # If today is different from the stored date, reset last push counter
          if [ "$TODAY" != "$DATE_PART" ]; then
            NEW_VERSION="$TODAY.01"
          else
            NEW_PUSH_NUMBER=$(printf "%02d" $((10#$LAST_PUSH + 1)))  # Increment last push count
            NEW_VERSION="$DATE_PART.$NEW_PUSH_NUMBER"
          fi

          # Update environment.ts with new version
          sed -i "s/version: '.*'/version: '$NEW_VERSION'/" apps/web/src/environments/environment.ts

          # Update apps/web/package.json
          jq ".version = \"$NEW_VERSION\"" apps/web/package.json > tmp.$$.json && mv tmp.$$.json apps/web/package.json
          # The monorepo lockfile also records the workspace version
          jq ".packages[\"apps/web\"].version = \"$NEW_VERSION\"" package-lock.json > tmp.$$.json && mv tmp.$$.json package-lock.json

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Updated version: $NEW_VERSION"

      - name: Commit updated files
        env:
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
        run: |
          git config --global user.email "$GIT_USER_EMAIL"
          git config --global user.name "$GIT_USER_NAME"
          git add apps/web/src/environments/environment.ts apps/web/package.json package-lock.json
          git commit -m "Bump web version to ${{ env.NEW_VERSION }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Create and push git tag
        run: |
          # web- prefix: API tags already use v<version>
          git tag web-v${{ env.NEW_VERSION }}
          git push origin web-v${{ env.NEW_VERSION }}
